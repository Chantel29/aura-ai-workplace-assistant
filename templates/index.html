<!DOCTYPE html>
<html>
<head>
<title>AURA AI</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-4">

<h1 class="text-center">AURA - AI Workplace Assistant</h1>

<hr>

<h3>Email Generator</h3>
<form action="/email" method="post">
<input name="purpose" class="form-control" placeholder="Email purpose">
<br>
<select name="tone" class="form-control">
<option>Formal</option>
<option>Friendly</option>
<option>Persuasive</option>
</select>
<br>
<button class="btn btn-primary">Generate</button>
</form>

<hr>

<h3>Meeting Summarizer</h3>
<form action="/meeting" method="post">
<textarea name="notes" class="form-control"></textarea>
<br>
<button class="btn btn-success">Summarize</button>
</form>

<hr>

<h3>Task Planner</h3>
<form action="/tasks" method="post">
<textarea name="tasks" class="form-control"></textarea>
<br>
<button class="btn btn-warning">Plan</button>
</form>

<hr>

<h3>Research Assistant</h3>
<form action="/research" method="post">
<textarea name="text" class="form-control"></textarea>
<br>
<button class="btn btn-info">Analyze</button>
</form>

<hr>

<h3>Future Me Predictor</h3>
<form action="/futureme" method="post">
<textarea name="data" class="form-control"></textarea>
<br>
<button class="btn btn-danger">Predict</button>
</form>

</body>
</html>
